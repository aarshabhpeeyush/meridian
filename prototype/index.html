<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian</title>
<style>
/* Meridian v3 — follows UI-REFERENCE.md (Helium / Chrome / Firefox conventions)
   Frame = page colour; hairlines only; filled fields; neutral grey; no accent in the frame. */
:root{
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --frame:#ffffff; --page:#ffffff; --hair:#e3e3e3;
  --field:#f1f1f1; --field-hover:#ebebeb;
  --hover:#f2f2f2; --active:#ebebeb; --press:#e2e2e2;
  --text:#1f1f1f; --text-2:#5e5e5e; --text-3:#8f8f8f; --icon:#474747;
  --menu:#ffffff; --menu-shadow:0 4px 16px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.06);
  --focus:#0b57d0;
  --tab-h:32px; --bar-h:44px; --side-w:240px;
  color-scheme:light;
}
:root[data-density="compact"]{--tab-h:28px;--bar-h:38px;--side-w:224px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --frame:#1f1f1f; --page:#1f1f1f; --hair:#333; --field:#2a2a2a; --field-hover:#323232;
  --hover:#2a2a2a; --active:#333; --press:#3a3a3a; --text:#e8e8e8; --text-2:#b0b0b0; --text-3:#7c7c7c; --icon:#c7c7c7;
  --menu:#2a2a2a; --menu-shadow:0 6px 20px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.07); --focus:#a8c7fa; color-scheme:dark}}
:root[data-theme="dark"]{
  --frame:#1f1f1f; --page:#1f1f1f; --hair:#333; --field:#2a2a2a; --field-hover:#323232;
  --hover:#2a2a2a; --active:#333; --press:#3a3a3a; --text:#e8e8e8; --text-2:#b0b0b0; --text-3:#7c7c7c; --icon:#c7c7c7;
  --menu:#2a2a2a; --menu-shadow:0 6px 20px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.07); --focus:#a8c7fa; color-scheme:dark}
/* Semi-dark: a softer mid-grey dark, lower contrast than Dark */
:root[data-theme="dim"]{
  --frame:#35363a; --page:#35363a; --hair:#47484d; --field:#404145; --field-hover:#48494e;
  --hover:#3f4044; --active:#4a4b50; --press:#525358; --text:#e3e3e6; --text-2:#b4b5ba; --text-3:#8d8e94; --icon:#c9cacf;
  --menu:#3d3e42; --menu-shadow:0 6px 20px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06); --focus:#8ab4f8; color-scheme:dark}
/* Eye comfort: deep blue-violet dark with softened, slightly warm text */
:root[data-theme="eye"]{
  --frame:#1c1b2e; --page:#1c1b2e; --hair:#2e2c47; --field:#26243d; --field-hover:#2d2b47;
  --hover:#25233b; --active:#302e4c; --press:#383657; --text:#ddd9ec; --text-2:#a9a4c4; --text-3:#7a7598; --icon:#bdb8d8;
  --menu:#24223a; --menu-shadow:0 6px 22px rgba(5,3,20,.6),0 0 0 1px rgba(180,170,255,.08); --focus:#a99cff; color-scheme:dark}
/* Eye comfort also gently dims and warms web pages */
:root[data-theme="eye"] .pane .view>.w,:root[data-theme="eye"] .glance .view>.w,:root[data-theme="eye"] .pane .view>.mail,:root[data-theme="eye"] .pane .view>.kb{filter:brightness(.88) sepia(.08)}
:root[data-theme="dim"] .sw[aria-checked="true"]::after,:root[data-theme="eye"] .sw[aria-checked="true"]::after{background:#1c1b2e}
:root[data-theme="dim"] .b2.fill,:root[data-theme="eye"] .b2.fill{color:#1c1b2e}
/* Theme preview tiles in Settings */
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 16px}
.th{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px;color:var(--text-2)}
.th .pv{width:100%;aspect-ratio:16/10;border-radius:8px;border:1px solid var(--hair);overflow:hidden;display:grid;grid-template-columns:28% 1fr;grid-template-rows:22% 1fr;background:var(--f)}
.th .pv i{grid-column:2;margin:5px 6px 0 0;border-radius:4px;background:var(--fl)}
.th .pv b{grid-column:2;margin:5px 6px 0 0;border-radius:6px 0 0 0;background:var(--pg);border:1px solid var(--hl);border-width:1px 0 0 1px}
.th .pv s{grid-row:1/3;grid-column:1;margin:24% 6px 0 6px;height:8px;border-radius:3px;background:var(--fl)}
.th.on .pv{outline:2px solid var(--focus);outline-offset:2px}
.th.on{color:var(--text);font-weight:600}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--frame);color:var(--text);font:13px/1.35 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:6px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:var(--icon);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}

/* ---------- Window grid ---------- */
.win{position:fixed;inset:0;display:grid;grid-template-rows:var(--bar-h) 1fr}
.win[data-layout="vertical"]{grid-template-columns:var(--side-w) 1fr}
.win[data-layout="vertical"].collapsed{grid-template-columns:52px 1fr}
.win[data-layout="horizontal"]{grid-template-columns:1fr;grid-template-rows:38px var(--bar-h) 1fr}

/* ---------- Top bar ---------- */
.lead{display:flex;align-items:center;gap:2px;padding:0 4px 0 8px;min-width:0}
.bar{display:flex;align-items:center;gap:4px;min-width:0;padding-right:0}
.win[data-layout="horizontal"] .lead{display:none}
.win[data-layout="horizontal"] .bar{grid-column:1;padding-left:8px;border-bottom:1px solid var(--hair)}
.win[data-layout="horizontal"] .bar .wc{display:none}
.win.collapsed .lead .navgrp{display:none}
.navgrp{display:flex;gap:2px}
.win[data-layout="vertical"] .bar .navgrp{display:none}
.win.collapsed .bar .navgrp{display:flex!important;margin-left:0}
.btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;position:relative}
.btn:hover{background:var(--hover)} .btn:active{background:var(--press)}
.btn:disabled{opacity:.4;background:none}
.btn.on{background:var(--active)}
:root[data-density="compact"] .btn{width:28px;height:28px}

.omni{flex:1;min-width:0;max-width:880px;margin:0 auto;position:relative}
.field{height:32px;display:flex;align-items:center;gap:2px;background:var(--field);border-radius:8px;padding:0 4px;cursor:text}
:root[data-density="compact"] .field{height:28px}
.field:hover{background:var(--field-hover)}
.field .btn{width:26px;height:24px;border-radius:6px}
.field .btn:hover{background:var(--press)}
.url{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;color:var(--text-3)}
.url b{font-weight:400;color:var(--text)}
.omni input{display:none;flex:1;min-width:0;border:0;outline:0;background:none;font:13px var(--font);color:var(--text);padding:0 4px}
/* open state: the address bar grows into the dropdown (Chrome / Firefox / Helium pattern) */
.omni.open .field{background:var(--menu);border-radius:8px 8px 0 0;box-shadow:var(--menu-shadow);position:relative;z-index:31}
.omni.open .url{display:none} .omni.open input{display:block}
.drop{display:none;position:absolute;left:0;right:0;top:32px;background:var(--menu);border-radius:0 0 8px 8px;box-shadow:var(--menu-shadow);z-index:30;padding:4px 0 6px;clip-path:inset(0 -24px -24px -24px)}
:root[data-density="compact"] .drop{top:28px}
.omni.open .drop{display:block}
.drop .sep{height:1px;background:var(--hair);margin:4px 0}
.row{display:flex;align-items:center;gap:12px;height:34px;padding:0 12px}
.row.sel{background:var(--hover)}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .h{color:var(--text-3)}
.row .k{color:var(--text-3);font-size:12px}
.row .tag{font-size:11px;color:var(--text-2);background:var(--field);border-radius:4px;padding:1px 6px}
.dhead{font-size:11px;color:var(--text-3);padding:8px 12px 2px}

.wc{display:flex;align-self:stretch;flex:none;margin-left:4px}
.wc button{width:46px;display:grid;place-items:center}
.wc button:hover{background:var(--hover)} .wc .x:hover{background:#c42b1c} .wc .x:hover svg{stroke:#fff}
.wc svg{width:10px;height:10px;fill:none;stroke:var(--text);stroke-width:1}

/* ---------- Sidebar ---------- */
.side{grid-row:2;display:flex;flex-direction:column;min-height:0;padding:0 8px 8px}
.win[data-layout="horizontal"] .side{display:none}
.win.collapsed .side{padding:0 6px 8px}
.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;padding:2px 0 8px}
.pin{height:36px;border-radius:8px;display:grid;place-items:center;background:var(--field);position:relative}
.pin:hover{background:var(--field-hover)} .pin.on{background:var(--active)}
.pin .badge{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:#d93025;box-shadow:0 0 0 2px var(--field)}
.win.collapsed .pins{grid-template-columns:1fr}
.list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--active) transparent}
.tab{height:var(--tab-h);display:flex;align-items:center;gap:10px;padding:0 4px 0 10px;border-radius:8px;position:relative;user-select:none}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--active)}
.tab .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.zz .t{color:var(--text-3)} .tab.zz .fav{opacity:.5;filter:grayscale(1)}
.tab .mini{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:none}
.tab .mini:hover{background:var(--press)}
.tab .mini .ic{width:14px;height:14px}
.tab:not(:hover):not(.on) .close{display:none}
.win.collapsed .tab{justify-content:center;padding:0}
.win.collapsed .tab .t,.win.collapsed .tab .mini{display:none}
.fav{width:16px;height:16px;flex:none;border-radius:3px;object-fit:contain}
.grp{margin-top:6px}
.grp-h{width:100%;height:26px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;color:var(--text-2);font-size:12px}
.grp-h:hover{background:var(--hover)}
.grp-h .dot{width:8px;height:8px;border-radius:50%;flex:none}
.grp-h .n{margin-left:auto;color:var(--text-3)}
.grp-h .ic{width:14px;height:14px;transition:transform .12s}
.grp.shut .grp-h .ic{transform:rotate(-90deg)} .grp.shut .grp-b{display:none}
.grp-b{position:relative}
.grp-b::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:2px;border-radius:1px;background:var(--gc);opacity:.7}
.win.collapsed .grp-h{justify-content:center;padding:0}.win.collapsed .grp-h :not(.dot){display:none}
.win.collapsed .grp-b::before{left:0}
.hr{height:1px;background:var(--hair);margin:8px 4px}
.newtab{width:100%;height:var(--tab-h);display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;color:var(--text-3)}
.newtab:hover{background:var(--hover);color:var(--text-2)}
.newtab .ic{width:16px;height:16px;stroke:var(--text-3)}
.win.collapsed .newtab{justify-content:center;padding:0}.win.collapsed .newtab span{display:none}
.foot{display:flex;align-items:center;gap:2px;padding-top:8px}
.ctx{display:flex;gap:2px;flex:1}
.ctx button{height:28px;min-width:28px;padding:0 8px;border-radius:8px;display:flex;align-items:center;gap:6px;color:var(--text-2)}
.ctx button:hover{background:var(--hover)}
.ctx button.on{background:var(--active);color:var(--text)}
.ctx button i{width:8px;height:8px;border-radius:50%;flex:none}
.ctx button:not(.on) span{display:none}
.win.collapsed .foot,.win.collapsed .ctx{flex-direction:column}
.win.collapsed .ctx button span{display:none}

/* ---------- Horizontal tab strip (Chrome-style) ---------- */
.strip{display:none;align-items:flex-end;min-width:0;background:var(--field);padding-left:8px}
.win[data-layout="horizontal"] .strip{display:flex}
.htabs{display:flex;align-items:flex-end;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none;height:100%;padding-top:6px}
.htabs .tab{flex:0 1 228px;min-width:100px;height:32px;border-radius:8px 8px 0 0;padding:0 4px 0 12px}
.htabs .tab:hover{background:var(--hover)}
.htabs .tab.on{background:var(--frame)}
.htabs .tab:not(.on):not(:hover)+.tab:not(.on):not(:hover)::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:1px;background:var(--press)}
.htabs .tab.p{flex:0 0 40px;min-width:40px;justify-content:center;padding:0}
.htabs .gl{align-self:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;color:#fff;flex:none;margin:0 4px;display:flex;align-items:center}
.strip .add{align-self:center}
.strip .ctx{flex:none;align-self:center;margin-right:6px}

/* ---------- Content ---------- */
.content{grid-column:2;grid-row:2;min-height:0;display:flex;background:var(--page);border-top:1px solid var(--hair);border-left:1px solid var(--hair);border-top-left-radius:10px;overflow:hidden;position:relative}
.win[data-layout="horizontal"] .content{grid-column:1;grid-row:3;border:0;border-radius:0}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;color:#202124;position:relative}
.split .pane+.pane{border-left:1px solid var(--hair)}
.phead{display:none;height:28px;align-items:center;gap:8px;padding:0 4px 0 10px;border-bottom:1px solid var(--hair);background:var(--frame);color:var(--text-2);font-size:12px}
.split .phead{display:flex}
.split .pane.focus .phead{color:var(--text)}
.split .pane.focus .phead::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--focus)}
.phead .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.phead .btn{width:22px;height:22px;border-radius:5px}
.phead .ic{width:14px;height:14px}
.view{flex:1;overflow:auto;min-height:0}
.status{position:absolute;left:6px;bottom:6px;max-width:60%;background:var(--menu);box-shadow:var(--menu-shadow);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none;z-index:5}
.status.show{display:block}

/* ---------- Menus / dialogs ---------- */
.veil{position:fixed;inset:0;z-index:20;display:none}.veil.show{display:block}
.veil.dim{background:rgba(0,0,0,.3)}
.menu{position:fixed;z-index:30;background:var(--menu);border-radius:8px;box-shadow:var(--menu-shadow);padding:6px 0;min-width:280px;display:none;color:var(--text)}
.menu.show{display:block}
.menu .mi{display:flex;align-items:center;gap:12px;width:100%;height:32px;padding:0 14px;text-align:left}
.menu .mi:hover{background:var(--hover)}
.menu .mi .g{flex:1}
.menu .mi .k{color:var(--text-3);font-size:12px}
.menu .mi.two{height:auto;padding:8px 14px}
.menu .mi.two small{display:block;color:var(--text-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{max-width:420px}.menu .mi .g{min-width:0}.menu .dhead{padding:6px 14px 2px}
.menu .sep{height:1px;background:var(--hair);margin:6px 0}
.menu .head{padding:8px 14px 6px;font-weight:600}
.menu .head small{display:block;font-weight:400;color:var(--text-2)}
.menu .ck{width:16px}
.sw{width:34px;height:18px;border-radius:9px;background:var(--press);position:relative;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .12s}
.sw[aria-checked="true"]{background:var(--focus)} .sw[aria-checked="true"]::after{transform:translateX(16px)}
:root[data-theme="dark"] .sw[aria-checked="true"]::after{background:#062e6f}

.glance{position:fixed;inset:56px 9% 28px;z-index:30;display:none;flex-direction:column;background:var(--menu);border-radius:10px;box-shadow:var(--menu-shadow);overflow:hidden}
.glance.show{display:flex}
.gbar{height:40px;display:flex;align-items:center;gap:4px;padding:0 6px 0 14px;border-bottom:1px solid var(--hair)}
.gbar .u{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--text-2)}
.pill{height:28px;padding:0 12px;border-radius:8px;background:var(--field)}
.pill:hover{background:var(--field-hover)}
.glance .view{background:#fff}

.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,92vw);background:var(--menu);border-radius:12px;box-shadow:var(--menu-shadow);z-index:40;padding:24px;display:none}
.dialog.show{display:block}
.dialog h2{font-size:18px;font-weight:600;margin:0 0 4px}
.dialog p{color:var(--text-2);margin:0 0 16px}
.choice{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:8px;text-align:left}
.choice:hover{background:var(--hover)}
.choice .r{width:18px;height:18px;border-radius:50%;border:2px solid var(--text-3);flex:none}
.choice.on .r{border:5px solid var(--focus)}
.choice small{display:block;color:var(--text-2)}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.b2{height:32px;padding:0 16px;border-radius:16px;border:1px solid var(--hair);color:var(--focus);font-weight:600}
.b2:hover{background:var(--hover)}
.b2.fill{background:var(--focus);border-color:var(--focus);color:#fff}
:root[data-theme="dark"] .b2.fill{color:#062e6f}

/* ---------- Built-in pages (settings / new tab) follow the frame theme ---------- */
.ipage{background:var(--frame);color:var(--text);min-height:100%}
.set{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.set nav{padding:16px 8px}
.set nav .h{font-size:20px;padding:4px 12px 16px}
.set nav a{display:flex;height:36px;align-items:center;padding:0 12px;border-radius:0 18px 18px 0;margin-left:-8px;padding-left:20px;color:var(--text)}
.set nav a:hover{background:var(--hover)}
.set nav a.on{background:var(--active);font-weight:600}
.set main{padding:24px 32px 64px;max-width:720px}
.set h3{font-size:15px;font-weight:600;margin:24px 0 10px}
.set h3:first-child{margin-top:4px}
.card{background:var(--page);border:1px solid var(--hair);border-radius:10px}
.srow{display:flex;align-items:center;gap:16px;padding:12px 16px;min-height:56px}
.srow+.srow{border-top:1px solid var(--hair)}
.srow .g{flex:1}.srow small{display:block;color:var(--text-2);font-size:12px;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:16px;overflow:hidden}
.seg button{height:30px;padding:0 14px;color:var(--text-2)}
.seg button+button{border-left:1px solid var(--hair)}
.seg button.on{background:var(--active);color:var(--text);font-weight:600}
select{font:13px var(--font);color:var(--text);background:var(--field);border:0;border-radius:8px;height:32px;padding:0 10px;min-width:150px}
.dots{display:flex;gap:8px}
.dots button{width:20px;height:20px;border-radius:50%}
.dots button.on{box-shadow:0 0 0 2px var(--page),0 0 0 4px var(--text-2)}
/* New tab: a little character. The sun arc is the signature ("meridian" = the sun's midday line). */
.ntp{position:relative;height:100%;min-height:100%;overflow:hidden;display:flex;justify-content:center}

.ntp .box{position:relative;width:min(600px,90%);padding-top:clamp(48px,20vh,200px);display:flex;flex-direction:column;align-items:center}
.ntp .sun{width:200px;height:64px;overflow:visible;fill:none;stroke-linecap:round}
.ntp .sun .trk{stroke:var(--text-3);stroke-width:1;stroke-dasharray:2 4;opacity:.7}
.ntp .sun .done{stroke:var(--text-2);stroke-width:1.5}
.ntp .sun .hz{stroke:var(--hair);stroke-width:1}
.ntp .sun text{fill:var(--text-3);stroke:none;font:10px var(--font);letter-spacing:.06em}
.ntp .sun .orb{fill:#f2a33a;stroke:var(--frame);stroke-width:3}
.ntp .sun .moon{fill:none;stroke:var(--text-2);stroke-width:1.5}
.ntp h1{font-size:30px;font-weight:600;letter-spacing:-.015em;margin:14px 0 4px;color:var(--text)}
.ntp .sub{color:var(--text-2);font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:26px}
.ntp .sub i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ntp .s{width:100%;height:46px;border-radius:23px;background:var(--field);display:flex;align-items:center;gap:12px;padding:0 18px;color:var(--text-3);cursor:text}
.ntp .s:hover{background:var(--field-hover)}
.ntp .s kbd{margin-left:auto;font:11px var(--mono);color:var(--text-3);border:1px solid var(--hair);border-radius:5px;padding:2px 6px}
.ntp .tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:22px;width:100%}
.ntp .tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:10px;font-size:12px;color:var(--text-2)}
.ntp .tile:hover{background:var(--hover)}
.ntp .tile span.c{width:44px;height:44px;border-radius:50%;background:var(--field);display:grid;place-items:center;transition:transform .15s}
.ntp .tile:hover span.c{transform:translateY(-2px)}
.ntp .tile .fav{width:20px;height:20px}


/* ---------- Mock website content (light, neutral, each its own "site") ---------- */
.w{font:14px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2328;min-height:100%;background:#fff}
.w a{color:#0969da;text-decoration:none;cursor:pointer}.w a:hover{text-decoration:underline}
.w code{font:12.5px var(--mono);background:#f2f3f5;border-radius:4px;padding:1px 5px}
.w pre{font:12.5px/1.5 var(--mono);background:#f6f8fa;border:1px solid #e4e7eb;border-radius:6px;padding:12px 14px;overflow:auto}
.sh{height:56px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid #e5e7eb}
.sh .n{font-weight:600}.sh .m{color:#6b7280;font-size:13px}.sh .sp{flex:1}
.sh .q{width:240px;height:32px;border:1px solid #d0d7de;border-radius:6px;background:#f6f8fa;color:#8b949e;display:flex;align-items:center;padding:0 10px;font-size:13px}
.art{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1080px;margin:0 auto}
.art aside{padding:24px 12px;font-size:13px;color:#4b5563;border-right:1px solid #eef0f2}
.art aside div{padding:5px 10px;border-radius:6px}.art aside .on{background:#eef4ff;color:#1d4ed8;font-weight:600}
.art article{padding:28px 48px 80px;max-width:780px}
.art h1{font-size:30px;line-height:1.2;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
.art .meta{color:#6b7280;font-size:13px;margin-bottom:20px}
.art h2{font-size:20px;font-weight:600;margin:30px 0 8px}
.callout{border-left:3px solid #3b82f6;background:#f5f9ff;padding:10px 14px;border-radius:0 6px 6px 0;font-size:13.5px;margin:16px 0}
.pr{padding:20px 32px 0;border-bottom:1px solid #d1d9e0}
.pr h1{font-size:24px;font-weight:400;margin:0 0 8px}.pr h1 span{color:#59636e}
.st{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;background:#1f883d;color:#fff;font-size:13px;font-weight:600;margin-right:8px}
.ptabs{display:flex;gap:24px;margin-top:14px;font-size:13px}.ptabs span{padding:8px 0;color:#59636e}.ptabs .on{color:#1f2328;font-weight:600;box-shadow:inset 0 -2px 0 #fd8c73}
.file{margin:16px 32px;border:1px solid #d1d9e0;border-radius:6px;overflow:hidden}
.fh{background:#f6f8fa;padding:8px 12px;font:12px var(--mono);border-bottom:1px solid #d1d9e0;display:flex;justify-content:space-between}
.fh .c{color:#1a7f37}
.diff{font:12px/20px var(--mono)}
.diff div{display:flex;white-space:pre;min-height:20px}
.diff i{font-style:normal;width:48px;text-align:right;padding-right:10px;color:#8c959f;flex:none}
.diff .a{background:#e6ffec}.diff .a i{background:#ccffd8}.diff .d{background:#ffebe9}.diff .d i{background:#ffd7d5}.diff .hk{background:#ddf4ff;color:#59636e}
.runs{width:100%;border-collapse:collapse;font-size:13px}.runs td{padding:10px 12px;border-bottom:1px solid #e5e7eb}.runs td:last-child{text-align:right;color:#6b7280;font:12px var(--mono)}
.ok{color:#1a7f37}
.mail{display:grid;grid-template-columns:200px 1fr;min-height:100%;font:13px/1.4 "Segoe UI",system-ui,sans-serif;background:#faf9f8}
.mail aside{padding:12px 8px}.mail aside .nw{height:32px;border-radius:4px;background:#0f6cbd;color:#fff;display:grid;place-items:center;font-weight:600;margin:0 4px 12px}
.mail aside div{display:flex;justify-content:space-between;padding:7px 12px;border-radius:4px;color:#242424}.mail aside .on{background:#e1dfdd;font-weight:600}
.mail .lst{background:#fff;border-left:1px solid #edebe9}
.mr{display:grid;grid-template-columns:190px 1fr 72px;gap:14px;padding:10px 16px;border-bottom:1px solid #f3f2f1;align-items:baseline}
.mr.u{font-weight:600}.mr.u span:first-child{color:#0f6cbd}
.mr .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mr .s span{font-weight:400;color:#605e5c}
.mr .tm{text-align:right;color:#605e5c;font-size:12px}
.kb{display:flex;gap:16px;padding:16px 24px;align-items:flex-start;background:#fbfbfb;min-height:100%;font:13px/1.4 Inter,"Segoe UI",system-ui,sans-serif;color:#1b1b1b}
.kc{width:260px;flex:none}.kc h4{font-size:13px;font-weight:600;margin:4px 6px 10px;display:flex;gap:8px;color:#3c3c3c}.kc h4 span{color:#8a8a8a;font-weight:400}
.ki{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.ki .id{font-size:12px;color:#8a8a8a;margin-bottom:4px}.ki .l{display:inline-block;font-size:11px;color:#555;border:1px solid #e3e3e3;border-radius:10px;padding:0 7px;margin-top:8px}
.asleep{display:grid;place-items:center;height:100%;color:#6b7280;text-align:center;font-size:13px}

/* =====================================================================
   v3.1 — ideas taken from the browser UI review (see UI-REFERENCE.md)
   ===================================================================== */
[hidden]{display:none!important}
:root{--panel-w:320px;--toast-bg:#2b2b2b;--toast-fg:#f1f1f1;--toast-act:#a8c7fa}
:root[data-theme="dark"],:root[data-theme="dim"],:root[data-theme="eye"]{--toast-bg:#e8e8e8;--toast-fg:#1f1f1f;--toast-act:#0b57d0}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--toast-bg:#e8e8e8;--toast-fg:#1f1f1f;--toast-act:#0b57d0}}
.foot .btn{width:28px;height:28px}
.sv .n{margin-left:auto;font-size:12px}
.win.collapsed .sv .n{display:none}
.tab.gone{opacity:0;transform:translateX(-14px);transition:opacity .2s,transform .2s}

/* Side panel — Vivaldi-style: web panels open inside the panel; Edge-style: every item removable */
.win[data-layout="vertical"] .bar{grid-column:2/-1}
.win[data-layout="horizontal"] .strip,.win[data-layout="horizontal"] .bar{grid-column:1/-1}
.win.haspanel[data-layout="vertical"]{grid-template-columns:var(--side-w) 1fr var(--panel-w)}
.win.haspanel[data-layout="vertical"].collapsed{grid-template-columns:52px 1fr var(--panel-w)}
.win.haspanel[data-layout="horizontal"]{grid-template-columns:1fr var(--panel-w)}
.spanel{display:none;flex-direction:column;min-height:0;min-width:0;background:var(--frame);border-top:1px solid var(--hair);border-left:1px solid var(--hair);grid-row:2;grid-column:3}
.win[data-layout="horizontal"] .spanel{grid-row:3;grid-column:2;border-top:0}
.win.haspanel .spanel{display:flex}
.sph{display:flex;align-items:center;gap:2px;padding:6px;border-bottom:1px solid var(--hair)}
.sph .btn{width:30px;height:30px}
.sph .sp{flex:1}
.spb{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px}
.note .src span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spb.web{padding:0;background:#fff;color:#1f2328}
.spb .art{grid-template-columns:1fr}.spb .art aside{display:none}.spb .art article{padding:16px}.spb .art h1{font-size:22px}
.spbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 10px;font-weight:600}
.spbar .pill{font-weight:400;height:26px;font-size:12px}
.empty{color:var(--text-2);font-size:12.5px;padding:12px 4px;line-height:1.5}
.note{background:var(--page);border:1px solid var(--hair);border-radius:8px;padding:8px 10px;margin-bottom:8px;position:relative}
.note q{display:block;quotes:none;border-left:2px solid var(--hair);padding-left:8px;margin:2px 0 6px;color:var(--text-2);font-size:12.5px}
.note textarea{width:100%;border:0;background:none;color:var(--text);font:13px/1.45 var(--font);resize:vertical;outline:0;min-height:40px;padding:0}
.note .src{font-size:11px;color:var(--text-3);display:flex;gap:6px;align-items:center;margin-top:4px}
.note .src .fav{width:12px;height:12px}
.note .mini{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:6px;display:none;place-items:center}
.note:hover .mini{display:grid}.note .mini:hover{background:var(--hover)}.note .mini .ic{width:14px;height:14px}
.pl{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:6px 8px;border-radius:8px;text-align:left}
.pl:hover{background:var(--hover)}
.pl .t{flex:1;min-width:0}.pl .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl small{color:var(--text-3);font-size:11.5px}
.chat{padding:4px 12px 12px;font-size:13px}.chat h4{margin:8px 0;font-size:13px}
.cm{padding:8px 2px;border-bottom:1px solid #eef0f2}.cm span{color:#6b7280;font-size:12px;margin-left:4px}
:root[data-theme="eye"] .spb.web>.w{filter:brightness(.88) sepia(.08)}

/* Focus mode — Orion/Zen: hide all UI, reveal it from the screen edge. Unlike Zen, it has a visible button. */
.win.focus{grid-template-columns:0 1fr!important;grid-template-rows:0 1fr!important}
.win.focus[data-layout="horizontal"]{grid-template-columns:1fr!important;grid-template-rows:0 0 1fr!important}
.win.focus .spanel,.win.focus .lead{display:none!important}
.win.focus .content{border:0;border-radius:0}
.win.focus .bar,.win.focus .strip{position:fixed;left:0;right:0;z-index:16;background:var(--frame);transform:translateY(-110%);transition:transform .16s ease;box-shadow:0 1px 0 var(--hair),0 8px 18px rgba(0,0,0,.1)}
.win.focus .bar{top:0;height:var(--bar-h);padding-left:8px}
.win.focus .strip{top:0;height:38px}
.win.focus[data-layout="horizontal"] .bar{top:38px}
.win.focus .bar .navgrp{display:flex!important}
.win.focus.pt .bar,.win.focus.pt .strip{transform:none}
.win.focus .side{position:fixed;left:0;top:0;bottom:0;width:var(--side-w);z-index:15;background:var(--frame);padding-top:8px;transform:translateX(-105%);transition:transform .16s ease;box-shadow:1px 0 0 var(--hair),8px 0 18px rgba(0,0,0,.1)}
.win.focus.collapsed .side{width:52px}
.win.focus.pl .side{transform:none}
.hot{position:fixed;z-index:14;display:none}
.win.focus~.hot{display:block}
#hotT{left:0;right:0;top:0;height:6px}#hotL{left:0;top:0;bottom:0;width:6px}

/* Multi-row tabs (Floorp) for tabs on top */
.win[data-layout="horizontal"][data-wrap="wrap"]{grid-template-rows:auto var(--bar-h) 1fr}
.win[data-wrap="wrap"] .strip{align-items:flex-start;min-height:38px}
.win[data-wrap="wrap"] .htabs{flex-wrap:wrap;height:auto;overflow:visible;padding:6px 0 4px;row-gap:3px}
.win[data-wrap="wrap"] .htabs .tab{flex:1 1 170px;max-width:240px;height:30px;border-radius:8px}
.win[data-wrap="wrap"] .strip>.btn,.win[data-wrap="wrap"] .strip>.ctx{align-self:flex-start;margin-top:4px}
.win[data-wrap="wrap"] .strip .wc{align-self:flex-start;height:38px}

/* Link hints — keyboard "follow mode" from Vieb / qutebrowser */
.hint{position:fixed;z-index:50;background:#ffd84d;color:#1f1f1f;font:700 11px/1 var(--mono);padding:3px 4px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.35);text-transform:uppercase;pointer-events:none}
.hint .m{opacity:.35}

/* Screenshot (Edge / Vivaldi) */
.shot{position:fixed;z-index:45;display:none;cursor:crosshair;background:rgba(0,0,0,.28);overflow:hidden}
.shot.show{display:block}.shot.drag{background:none}
.shot .sel{position:absolute;outline:1px solid #fff;box-shadow:0 0 0 100vmax rgba(0,0,0,.28);display:none}
.shbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--menu);color:var(--text);border-radius:10px;box-shadow:var(--menu-shadow);padding:6px 6px 6px 14px;cursor:default;white-space:nowrap}
.shbar span{color:var(--text-2);margin-right:6px}

/* Toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:60;background:var(--toast-bg);color:var(--toast-fg);border-radius:8px;padding:9px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .16s,transform .16s;max-width:min(640px,92vw)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--toast-act);font-weight:600;padding:4px 8px;margin:-4px -6px -4px 0;border-radius:6px;flex:none}
.toast button:hover{background:rgba(127,127,127,.18)}

/* "Add to notes" chip on text selection (Beam / Arc Easel) */
.clip{position:fixed;z-index:25;display:none;align-items:center;gap:6px;height:30px;padding:0 12px 0 8px;border-radius:8px;background:var(--menu);color:var(--text);box-shadow:var(--menu-shadow)}
.clip.show{display:flex}.clip:hover{background:var(--hover)}.clip .ic{width:16px;height:16px}

/* Dialog extras */
.dialog.wide{width:min(620px,94vw)}
.dialog .card{margin-bottom:4px}
.dialog input.tx{width:100%;height:36px;border:0;border-radius:8px;background:var(--field);color:var(--text);font:13px var(--font);padding:0 12px;outline:0;margin-bottom:14px}
.dialog input.tx:focus{box-shadow:0 0 0 2px var(--focus)}
.steps{display:flex;gap:6px;margin-right:auto;align-items:center}
.steps i{width:6px;height:6px;border-radius:50%;background:var(--press)}.steps i.on{background:var(--focus)}
.setup .themes{padding:4px 0 8px}
.tips{display:grid;gap:2px;margin:4px 0 14px}
.tips div{display:flex;align-items:center;gap:14px;padding:8px 2px}
.tips kbd,.kchip{font:12px var(--mono);background:var(--field);border-radius:6px;padding:4px 8px;color:var(--text);white-space:nowrap}
.tips kbd{min-width:132px;text-align:center}
.kchip{min-width:120px;height:28px}
.kchip:hover{background:var(--field-hover)}.kchip.rec{outline:2px solid var(--focus);color:var(--text-2)}
.kchip.none{color:var(--text-3)}
.tm{width:100%;border-collapse:collapse}
.tm td,.tm th{padding:7px 8px;text-align:left;border-bottom:1px solid var(--hair);font-size:12.5px;white-space:nowrap}
.tm th{color:var(--text-3);font-weight:400;position:sticky;top:0;background:var(--menu)}
.tm td.r,.tm th.r{text-align:right}.tm td:first-child{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tm .fav{vertical-align:-3px;margin-right:8px}
.tm .pill{height:24px;font-size:12px;padding:0 10px}
.tm .pill:disabled{opacity:.4}
.btn.tw::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--text-2)}

/* Settings: search + real sections (Vivaldi-style categories, Chrome-style search) */
.set nav a{cursor:default;user-select:none}
.ssearch{display:flex;align-items:center;gap:10px;height:36px;border-radius:18px;background:var(--field);padding:0 14px;margin-bottom:8px;max-width:520px}
.ssearch input{flex:1;min-width:0;border:0;outline:0;background:none;font:13px var(--font);color:var(--text)}
.themes+.srow{border-top:1px solid var(--hair)}
.srow .b2{flex:none}
.srow .k{color:var(--text-3);font-size:12px}

/* Per-site tweaks (Orion "Tweaks" / Arc "Boosts", kept simple) */
.view[data-font="serif"] .w :not(code):not(pre){font-family:Georgia,"Times New Roman",serif!important}
.view[data-font="sans"] .w :not(code):not(pre){font-family:system-ui,"Segoe UI",sans-serif!important}
.view[data-dark="1"]>*{filter:invert(.9) hue-rotate(180deg)}
.view[data-dark="1"] img{filter:invert(1) hue-rotate(180deg)}

/* New tab backdrop. Each backdrop re-sets the colour tokens locally so text stays readable. */
.ntp .globe{position:absolute;left:50%;bottom:-430px;width:1400px;height:860px;transform:translateX(-50%);pointer-events:none;fill:none;stroke:var(--text-3);stroke-width:1;opacity:.35;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 75%);mask-image:linear-gradient(to top,#000 10%,transparent 75%)}
.ntp.bd-light{--text:#1f1f1f;--text-2:#45474d;--text-3:#6b6e75;--field:rgba(255,255,255,.78);--field-hover:#fff;--hover:rgba(0,0,0,.06);--hair:rgba(0,0,0,.14);color:var(--text)}
.ntp.bd-dark{--text:#fff;--text-2:rgba(255,255,255,.86);--text-3:rgba(255,255,255,.66);--field:rgba(255,255,255,.16);--field-hover:rgba(255,255,255,.24);--hover:rgba(255,255,255,.12);--hair:rgba(255,255,255,.3);--icon:#fff;color:var(--text)}
.ntp.bd-dark h1{text-shadow:0 1px 14px rgba(0,0,0,.35)}
.ntp.bd-light .sun .orb,.ntp.bd-dark .sun .orb{stroke:none}
.ntp.bd-dark .ic{stroke:#fff}
.ntp .bdbtn{position:absolute;right:14px;bottom:14px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--field)}
.ntp .bdbtn:hover{background:var(--field-hover)}.ntp .bdbtn .ic{width:16px;height:16px}
.bdgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 14px 10px}
.bdsw{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--text-2)}
.bdsw i{display:block;width:100%;aspect-ratio:16/10;border-radius:8px;border:1px solid var(--hair);background-size:cover;background-position:center}
.bdsw:hover i{border-color:var(--text-3)}
.bdsw.on{color:var(--text);font-weight:600}.bdsw.on i{outline:2px solid var(--focus);outline-offset:2px}
.set .bdgrid{grid-template-columns:repeat(5,1fr);padding:2px 16px 14px}
</style>

  <!-- toolbar over the page column -->

 'g-ungroup':()=>{const d=data[S.ctx],g=d.groups[menuG];closeAll();d.groups.splice(menuG,1);d.tabs.unshift(...g.tabs);render()},
 'g-close':()=>{const d=data[S.ctx],g=d.groups[menuG];closeAll();d.groups.splice(menuG,1);g.tabs.forEach(t=>closed.push({t,c:S.ctx}));fixActive();render()},
 restore:el=>{const d=data[S.ctx],[g]=d.saved.splice(+el.dataset.i,1);closeAll();d.groups.push({name:g.name,color:g.color,open:true,tabs:g.tabs});S.split=null;S.active=g.tabs[0].id;render();toast(`Opened “${g.name}”`)},
 wake:el=>{const d=data[S.ctx],[s]=d.snoozed.splice(+el.dataset.i,1);closeAll();d.tabs.push(s.t);activate(s.t.id)},
 'pick-color':el=>{pickC=el.dataset.c;$$('#dlg .dots button').forEach(b=>b.classList.toggle('on',b===el))},

 'dlg-close':()=>closeAll(),'forget-go':()=>forgetGo(),
 'tw-reset':()=>{const t=find(shown()).t;delete tweaks[t.host];store.set('tweaks',tweaks);renderContent();renderUrl();tweakDialog()},
 'tm-unload':el=>{find(+el.dataset.t).t.zz=true;render();taskManager()},
 'tm-unload-all':()=>{const live=[shown(),...(S.split||[])];contexts.forEach(c=>all(c.id).forEach(t=>{if(!live.includes(t.id)&&!t.audio&&!['settings','new'].includes(t.kind))t.zz=true}));render();taskManager()},
 setup:()=>setup(0),'setup-import':()=>setup(2),'setup-next':()=>setup(setupStep+1),'setup-back':()=>setup(setupStep-1),'setup-skip':()=>{setupData.imp='none';setupDone()},'setup-done':()=>setupDone(),
 'make-default':()=>toast('Windows Default apps would open here so you can choose. Meridian never changes this by itself.'),

 addread:()=>{const t=find(shown())?.t;if(!t||!t.host){toast('Open a website to add it');return}if(!reading.some(r=>r.host===t.host&&r.path===t.path)){reading.unshift({title:t.title,host:t.host,path:t.path});store.set('reading',reading)}renderPanel();toast('Added to your reading list')},

   if(S.panel==='notes'){renderPanel();toast('Added to notes')}else toast('Added to notes','Show',()=>togglePanel('notes',true))},

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  if(S.rec&&!e.target.closest('[data-act="rec"]')){S.rec=null;refreshSettings();return}
  const a=e.target.closest('.view a[data-href]');if(a&&!e.target.closest('#gView')&&!e.target.closest('#spanel')){glance(a);return}
  const tp=e.target.closest('[data-theme-pick]');if(tp){setPref('theme',tp.dataset.themePick);return}
  const ac=e.target.closest('[data-act]');if(ac&&UI[ac.dataset.act]){e.stopPropagation();UI[ac.dataset.act](ac,e);return}
  const sw=e.target.closest('.sw');if(sw){const v=sw.getAttribute('aria-checked')!=='true';sw.setAttribute('aria-checked',v);if(sw.dataset.sw)onSwitch(sw.dataset.sw,v);return}
  const el=e.target.closest('[data-close],[data-mute],[data-group],[data-ctx],[data-id],[data-unsplit],[data-new],[data-settings],[data-i],.choice,.seg button,.dots button');if(!el)return;
  if(el.dataset.i!=null){const r=items[+el.dataset.i];closeAll();r&&r.run();return}
  if(el.dataset.new){closeAll();newTab();return}
  if(el.dataset.settings){closeAll();openSettings();return}
  if(el.dataset.close){e.stopPropagation();closeTab(+el.dataset.close);return}
  if(el.dataset.mute){find(el.dataset.mute).t.audio=false;render();return}
  if(el.dataset.group!=null){const g=data[S.ctx].groups[el.dataset.group];g.open=!g.open;render();return}
  if(el.dataset.ctx){if(e.target.closest('.ctx')&&el.dataset.ctx===S.ctx){ctxMenu(el);return}closeAll();switchCtx(el.dataset.ctx);return}
  if(el.dataset.unsplit!=null){const k=S.split[1-el.dataset.unsplit];S.split=null;S.active=k;render();return}
  if(el.classList.contains('choice')){el.parentElement.querySelectorAll('.choice').forEach(c=>c.classList.toggle('on',c===el));if(el.dataset.layout)setPref('layout',el.dataset.layout);if(el.dataset.imp)setupData.imp=el.dataset.imp;return}
  if(el.matches('.seg button')){setPref(el.parentElement.dataset.pref,el.dataset.v);return}
  if(el.matches('.dots button')){cur().color=el.dataset.color;render();return}
  if(el.dataset.id){activate(+el.dataset.id)}
});
document.addEventListener('contextmenu',e=>{const pt={x:e.clientX,y:e.clientY};
  const t=e.target.closest('.tab[data-id],.pin[data-id]');if(t&&!t.closest('#spanel')){e.preventDefault();tabMenu(+t.dataset.id,pt);return}
  const g=e.target.closest('[data-group]');if(g){e.preventDefault();groupMenu(+g.dataset.group,pt);return}
  const p=e.target.closest('.sph [data-p]');if(p){e.preventDefault();showMenu(mi('Remove from side panel','',`data-act="panel-remove" data-p="${p.dataset.p}"`),pt);return}
  if(e.target.closest('.bar,.strip,.lead')&&!e.target.closest('.omni')){e.preventDefault();showMenu(mi('Customize toolbar…','','data-act="toolbar"')+mi('Keyboard shortcuts…','','data-act="sec-open" data-s="shortcuts"'),pt)}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='setQ'){S.setQ=t.value;$('#setRes').innerHTML=setResults();renderUrl();$$('.set nav a').forEach(a=>a.classList.toggle('on',!S.setQ&&a.dataset.s===S.setSec));return}
  if(t.dataset.note!=null){notes[+t.dataset.note].text=t.value;saveNotes()}});
document.addEventListener('mouseover',e=>{const a=e.target.closest('.view a[data-href]');const s=$('#status');if(!s)return;s.textContent=a?a.dataset.href:'';s.classList.toggle('show',!!a)});
$('#content').addEventListener('mousedown',e=>{const p=e.target.closest('.pane');if(p&&S.split&&S.focus!==+p.dataset.pane){S.focus=+p.dataset.pane;$$('.pane').forEach(x=>x.classList.toggle('focus',x===p));renderUrl()}});
$('#veil').onclick=closeAll;
$('#bdFile').addEventListener('change',e=>{bdUpload(e.target.files[0]);e.target.value=''});
$('#field').addEventListener('click',e=>{if(e.target.closest('.btn'))return;if(!$('#omni').classList.contains('open'))openOmni()});
$('#infoBtn').onclick=e=>{e.stopPropagation();infoMenu()};$('#splitBtn').onclick=e=>{e.stopPropagation();toggleSplit()};$('#starBtn').onclick=e=>{e.stopPropagation();$('#starBtn').classList.toggle('on')};
$('#menuBtn').onclick=()=>mainMenu();$('#addH').onclick=newTab;$('#sideBtn').onclick=toggleSidebar;
$('#gX').onclick=closeAll;$('#gTab').onclick=()=>glanceOpen(false);$('#gSplit').onclick=()=>glanceOpen(true);
$('#hotT').addEventListener('mouseenter',()=>$('#win').classList.add('pt'));$('#hotL').addEventListener('mouseenter',()=>$('#win').classList.add('pl'));
$('.bar').addEventListener('mouseleave',unpeek('pt','.bar,.strip,#hotT'));$('.strip').addEventListener('mouseleave',unpeek('pt','.bar,.strip,#hotT'));$('.side').addEventListener('mouseleave',unpeek('pl','.side,#hotL'));
$('#q').addEventListener('input',()=>{sel=0;renderDrop()});
$('#q').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sel=Math.min(sel+1,items.length-1);renderDropKeep();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);renderDropKeep();e.preventDefault()}else if(e.key==='Enter'){const r=items[sel];closeAll();r&&r.run()}});
function renderDropKeep(){$$('#drop .row').forEach(r=>{const on=+r.dataset.i===sel;r.classList.toggle('sel',on);r.setAttribute('aria-selected',on)})}
document.addEventListener('keydown',e=>{
  if(hintMode){hintKey(e);return}
  if(S.rec){recKey(e);return}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('.dialog input.tx')){e.preventDefault();$('#dlg .b2.fill')?.click();return}
  const c=combo(e),typing=e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]');
  if(c){const id=Object.keys(KEYS).find(k=>KEYS[k]===c);if(id&&(!typing||/Ctrl\+|Alt\+/.test(c)||/^(Shift\+)?(F\d+|Esc)$/.test(c))){e.preventDefault();ACT[id][2]();return}}
  const k=e.key.toLowerCase();
  if(e.key==='Escape'){if($('#shot').classList.contains('show')){endShot();return}closeAll();return}
  if(e.ctrlKey&&k==='l'){e.preventDefault();openOmni();return}
  if(e.ctrlKey&&!e.shiftKey&&!e.altKey&&/^[1-4]$/.test(e.key)){e.preventDefault();switchCtx(contexts[+e.key-1].id);return}
  if(document.activeElement?.classList.contains('tab')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();activate(+document.activeElement.dataset.id)}});

setPref('layout',store.get('layout','vertical'));setPref('density',store.get('density','normal'));setPref('theme',store.get('theme','system'));setPref('tabwrap',store.get('tabwrap','scroll'));
applyToolbar();fixActive();render();
if(!store.get('setup2',false))setup(0);
</script>
